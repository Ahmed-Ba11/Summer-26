<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موفّر — بلا اتصال</title>
<style>
    @font-face {
        font-family: 'Thmanyah Sans';
        src: url('/fonts/thmanyahsans-Medium.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
    }
    @font-face {
        font-family: 'Thmanyah Sans';
        src: url('/fonts/thmanyahsans-Regular.woff2') format('woff2');
        font-weight: 400;
        font-display: swap;
    }

    :root { color-scheme: light dark; }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        font-family: 'Thmanyah Sans', system-ui, sans-serif;
        text-align: center;
        background: #f5f4f0;
        color: #1b1b1b;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #14181f; color: #f2f1ec; }
        .icon { background: #1f2733; }
    }

    .icon {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: #eceae1;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    svg { width: 28px; height: 28px; stroke: #2c4a6e; }

    h1 { font-size: 17px; font-weight: 500; margin: 0; }
    p { font-size: 13.5px; color: #6b6b6b; margin: 0; max-width: 280px; }

    button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 20px;
        border-radius: 12px;
        border: none;
        background: #2c4a6e;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
    }
    button:active { transform: scale(.98); }
</style>
</head>
<body>
    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 18h.01"/>
            <path d="M8.5 13.5a5 5 0 0 1 7 0"/>
            <path d="M5 10a10 10 0 0 1 14 0"/>
            <path d="M2 6.5a15 15 0 0 1 20 0" opacity=".4"/>
        </svg>
    </div>
    <h1>ما فيه اتصال بالإنترنت</h1>
    <p>تحقّق من اتصالك وحاول مرة أخرى — بياناتك المسجَّلة محفوظة بأمان.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
</body>
</html>
