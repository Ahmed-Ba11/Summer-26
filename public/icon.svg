<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="موفّر">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33567e"/>
      <stop offset="1" stop-color="#223c5c"/>
    </linearGradient>
  </defs>

  <!-- البلاطة: نفس انحناء البطاقات في الواجهة (rounded-2xl مكبّرة) -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!--
    الرمز: ثلاثة أعمدة صاعدة = الشهر يتحسّن، وأعلاها أخضر = الفائض.
    القوس السفلي يلمّها كأنها محفظة — شكل واحد يقرأ «ادخار» و«تتبّع» معاً.
  -->
  <g>
    <rect x="152" y="252" width="44" height="74"  rx="22" fill="#ffffff" opacity=".5"/>
    <rect x="234" y="206" width="44" height="120" rx="22" fill="#ffffff" opacity=".78"/>
    <rect x="316" y="146" width="44" height="180" rx="22" fill="#1fc78a"/>
  </g>

  <!-- جسم المحفظة: يلمّ الأعمدة من الجانبين والأسفل -->
  <path d="M136 300v46c0 34 28 62 62 62h116c34 0 62-28 62-62v-46"
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity=".94"/>
</svg>
