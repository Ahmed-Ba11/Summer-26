<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="موفّر">
  <!-- البلاطة: نفس انحناء البطاقات في الواجهة -->
  <rect width="512" height="512" rx="116" fill="#2b4a70"/>

  <!--
    محفظة مبسّطة: جسم + حدّ الطيّة + النقطة الخضراء = المتبقّي لك.
    عنصران ونقطة فقط — يبقى مقروءاً حتى عند 20px في شريط التنقّل.
  -->
  <rect x="126" y="186" width="260" height="180" rx="46" fill="none" stroke="#ffffff" stroke-width="30"/>
  <path d="M126 262h130" stroke="#ffffff" stroke-width="30" stroke-linecap="round" opacity=".4"/>
  <circle cx="330" cy="276" r="32" fill="#1fc78a"/>
</svg>
